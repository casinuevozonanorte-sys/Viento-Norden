name: Viento Norden

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: state.txt
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: pip install playwright pillow numpy && playwright install --with-deps chromium

      - run: python Monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: debug
          path: out/
          retention-days: 3
